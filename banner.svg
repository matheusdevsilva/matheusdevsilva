<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Grid lines horizontal -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>

  <!-- Grid lines vertical -->
  <line x1="100" y1="0" x2="100" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="200" y1="0" x2="200" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="300" y1="0" x2="300" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="500" y1="0" x2="500" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="700" y1="0" x2="700" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>
  <line x1="800" y1="0" x2="800" y2="200" stroke="#0f6e56" stroke-width="0.3" opacity="0.3"/>

  <!-- Glow dots -->
  <circle cx="150" cy="50" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="750" cy="150" r="2" fill="#00ff88" opacity="0.5"/>
  <circle cx="80"  cy="140" r="1.5" fill="#00ccff" opacity="0.4"/>
  <circle cx="820" cy="60"  r="1.5" fill="#00ccff" opacity="0.4"/>
  <circle cx="450" cy="30"  r="1.5" fill="#00ff88" opacity="0.3"/>
  <circle cx="300" cy="170" r="1"   fill="#00ff88" opacity="0.3"/>
  <circle cx="600" cy="170" r="1"   fill="#00ccff" opacity="0.3"/>

  <!-- Corner brackets -->
  <polyline points="20,20 20,10 30,10" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polyline points="870,20 880,20 880,10 870,10" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polyline points="20,180 20,190 30,190" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.7"/>
  <polyline points="870,180 880,180 880,190 870,190" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Main title -->
  <text x="450" y="90" font-family="monospace" font-size="42" font-weight="bold"
        fill="#00ff88" text-anchor="middle" filter="url(#glow)">Matheus Marques</text>

  <!-- Accent line -->
  <rect x="175" y="100" width="550" height="1.5" fill="url(#line)"/>

  <!-- Subtitle -->
  <text x="450" y="130" font-family="monospace" font-size="14"
        fill="#7ee8a2" text-anchor="middle" opacity="0.9">Full Stack Web  ·  Game Developer  ·  Infra &amp; Networks</text>

  <!-- Bottom tag -->
  <text x="450" y="165" font-family="monospace" font-size="11"
        fill="#0f6e56" text-anchor="middle" opacity="0.8">São Paulo, Brasil  //  github.com/matheusdevsilva</text>
</svg>
